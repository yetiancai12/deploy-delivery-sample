services:
  - type: web
    name: deploy-ready-sample
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    # commit = deploy on every push; checksPass = deploy only after CI (.github/workflows/ci.yml) passes; off = manual
    autoDeployTrigger: checksPass
    envVars:
      - key: GREETING
        value: Hello from Render
      - key: APP_VERSION
        value: 1.0.0
